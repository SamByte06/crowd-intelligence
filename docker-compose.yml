version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crowd_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./crowd_intel.db
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80"]
      - LOG_LEVEL=INFO
      - YOLO_MODEL=yolov8n.pt
    volumes:
      - ./backend/data:/app/data
      - ./backend/crowd_intel.db:/app/crowd_intel.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crowd_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
