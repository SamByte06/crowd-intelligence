version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crowd_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/crowd_intelligence.db
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
      - USE_HEAD_TRACKING=true
      - HEAD_MODEL_PATH=/app/11s-head.pt
      - TRACKER_TYPE=bytetrack.yaml
      - YOLO_DEVICE=auto
    volumes:
      - crowd_data:/app/data
      - ./backend/media_uploads:/app/media_uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crowd_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  crowd_data:
    driver: local
